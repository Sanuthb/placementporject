# An isolated, local stand-in for Supabase Auth + Postgres + an email sink, for the end-to-end tests. Nothing here talks to the internet.
#   docker compose -f tests/e2e/stack/docker-compose.yml up -d
# Ports: Postgres 54330, Auth (behind /auth/v1) 54321, mail sink SMTP 54326 and web/API 54325.
name: m2-e2e
services:
  db:
    image: supabase/postgres:15.8.1.060
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["54330:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"], interval: 3s, retries: 40 }
  auth:
    image: supabase/gotrue:v2.176.1
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3111
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_JWT_SECRET: local-test-only-jwt-secret-0123456789abcdef
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@test.local
      GOTRUE_SMTP_SENDER_NAME: e2e
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "10"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
  mail:
    image: axllent/mailpit:v1.21
    environment: { MP_SMTP_AUTH_ACCEPT_ANY: "true", MP_SMTP_AUTH_ALLOW_INSECURE: "true" }
    ports: ["54325:8025", "54326:1025"]
  storage:
    image: supabase/storage-api:v1.25.7
    depends_on: { db: { condition: service_healthy } }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_KEY}
      AUTH_JWT_SECRET: local-test-only-jwt-secret-0123456789abcdef
      AUTH_JWT_ALGORITHM: HS256
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:5432/postgres
      DB_INSTALL_ROLES: "false"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: local
      REGION: local
      GLOBAL_S3_BUCKET: local
      FILE_SIZE_LIMIT: "52428800"
      SERVER_PORT: "5000"
      ENABLE_IMAGE_TRANSFORMATION: "false"
  gateway:
    image: nginx:1.27-alpine
    depends_on: [auth, storage]
    ports: ["54321:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
