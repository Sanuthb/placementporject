# supabase-js calls <url>/auth/v1/... and <url>/storage/v1/...; each server serves the same paths at its root.
# The hosted Supabase gateway answers browser CORS preflights (the browser sends an `apikey` header, which Auth itself does not allow), so this local
# stand-in does too. Local test stack only: it allows any origin, which is what lets a browser on localhost sign in.
server {
  listen 80; client_max_body_size 60m;
  location /auth/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
      add_header Access-Control-Max-Age 600 always;
      add_header Content-Length 0 always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Expose-Headers "x-supabase-api-version" always;
    proxy_pass http://auth:9999/; proxy_set_header Host $host;
  }
  location /storage/v1/ { proxy_pass http://storage:5000/; proxy_set_header Host $host; }
}
