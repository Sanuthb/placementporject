name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx eslint app lib prisma scripts tests proxy.ts instrumentation.ts
      - run: npm run test:unit
      - run: npm run build
      - name: Route index is up to date
        run: npm run docs:routes && git diff --exit-code docs/ROUTES.md
